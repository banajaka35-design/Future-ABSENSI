name: Uji database

# Paket H1 (hemat menit GitHub, repo private = 2.000 menit/bulan): hanya push ke main, dan dilewati bila yang
# berubah hanya docs/ (tidak ada kode yang membaca isi docs/). Cabang pasang/reset tidak diuji ulang;
# db/periksa_pemicu.sh mencari commit main terdekat yang ujinya lulus (sesudahnya hanya boleh docs/).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  uji:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pasang klien psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Uji pembaca file (kasus jebakan bentuk file)
        run: node --test sistem/urai/uji_urai.ts
      - name: Uji pemeriksa pemicu Pasang/Reset (paket H1)
        run: sistem/uji/uji_pemicu.sh
      - name: Uji penghitung ukuran grafik halaman demo (paket G1)
        run: node --test sistem/uji/uji_grafik.ts
      - name: Jalankan semua migrasi dari nol lalu semua uji
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: db/uji/jalankan.sh
      - name: Uji simulasi Tahap 3 (U1, U4, U6, sidik) dengan data simulasi lengkap Pabrik A
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: sistem/uji/jalankan_simulasi.sh
      - name: Pasang postgres.js (versi sama dengan Edge Function) untuk uji penyambung
        run: npm install --no-save --no-package-lock postgres@3.4.5
      - name: Uji pintu Telegram (pesan tiruan, kasus T1-T8, N1-N9, P1-P7, S1)
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: sistem/uji/uji_pintu.sh
      - name: Pemeriksaan kewajaran data simulasi (isi data harus identik dengan yang tersimpan)
        run: cd generator && python3 buat_data.py > /dev/null && python3 periksa_kewajaran.py && git diff --exit-code -- ../data/simulasi/sidik_isi.txt
