name: Cadangan malam

# Setiap malam (dan setelah setiap pemasangan atau reset berhasil): cadangkan skema proyek dari Supabase, buktikan cadangan itu bisa dipulihkan ke
# Postgres 17 kosong dengan jumlah baris yang sama dengan sumber saat cadangan diambil (paket E2: di antara hitungan
# tepat sebelum dan sesudah cadangan), lalu sentuh Supabase lewat jalur API supaya
# proyek gratis tidak dijeda (PRD celah D7, aturan pondasi 11).
# Jadwal hanya berjalan dari cabang main.
on:
  schedule:
    - cron: "20 19 * * *" # 02.20 WIB
  workflow_dispatch:
  # Juga setiap kali Supabase selesai diubah lewat workflow "Pasang ke Supabase".
  workflow_run:
    workflows: ["Pasang ke Supabase", "Reset Supabase"]
    types: [completed]

concurrency:
  group: cadangan-malam
  cancel-in-progress: false

jobs:
  cadangan:
    # Setelah pemasangan, hanya jalan kalau pemasangannya berhasil.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Periksa secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "GAGAL: secret SUPABASE_DB_URL kosong atau tidak ditemukan." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Pasang klien Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Paket E1 (docs/rencana-e1.md): hanya file terenkripsi yang diunggah; kunci kosong -> GAGAL sebelum mengunggah.
      - name: Cadangan (terenkripsi)
        env:
          CADANGAN_KUNCI: ${{ secrets.CADANGAN_KUNCI }}
        run: |
          db/kunci_cadangan.sh periksa
          mkdir -p cadangan
          FILE="cadangan/malam-$(date -u +%Y%m%d-%H%M%S).dump"
          # Paket E2: jumlah baris sumber tepat sebelum dan sesudah cadangan (bot bisa menulis selama cadangan diambil).
          psql "$DB_URL" -X -q -t -A -v ON_ERROR_STOP=1 -f db/hitung_baris.sql > "$RUNNER_TEMP/baris_sebelum.txt"
          db/pasang_supabase.sh cadangan "$FILE"
          psql "$DB_URL" -X -q -t -A -v ON_ERROR_STOP=1 -f db/hitung_baris.sql > "$RUNNER_TEMP/baris_sesudah.txt"
          if [ ! -s "$FILE" ]; then
            echo "GAGAL: file cadangan tidak terbentuk (Supabase tidak berisi skema proyek?)." >&2
            exit 1
          fi
          db/kunci_cadangan.sh kunci "$FILE"
          echo "FILE_CADANGAN=$FILE.gpg" >> "$GITHUB_ENV"

      - name: Simpan cadangan terenkripsi (14 hari)
        uses: actions/upload-artifact@v4
        with:
          name: cadangan-malam-${{ github.run_number }}
          path: cadangan/
          retention-days: 14
          if-no-files-found: error

      # Memakai file terenkripsi yang diunggah: buka kunci lalu pulihkan (bukti cadangan bisa dibuka dan dipulihkan).
      - name: Uji pemulihan dari cadangan terenkripsi ke Postgres 17 kosong
        env:
          SUMBER_URL: ${{ secrets.SUPABASE_DB_URL }}
          TUJUAN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CADANGAN_KUNCI: ${{ secrets.CADANGAN_KUNCI }}
          BARIS_SEBELUM: ${{ runner.temp }}/baris_sebelum.txt
          BARIS_SESUDAH: ${{ runner.temp }}/baris_sesudah.txt
        run: |
          BUKA="$RUNNER_TEMP/pulih.dump"
          db/kunci_cadangan.sh buka "$FILE_CADANGAN" "$BUKA"
          db/uji_pemulihan.sh "$BUKA"
          rm -f "$BUKA"

      # Tetap jalan walau langkah cadangan gagal: proyek gratis tidak boleh dijeda (gerbang "demo hidup").
      - name: Sentuhan lewat jalur API Supabase
        if: ${{ !cancelled() }}
        env:
          KUNCI: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Alamat proyek diambil dari nama pengguna di SUPABASE_DB_URL (postgres.<ref>).
          REF="$(printf '%s' "$DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')"
          if [ -z "$REF" ]; then
            echo "GAGAL: kode proyek tidak terbaca dari SUPABASE_DB_URL (harus berbentuk postgres.<kode>:...)." >&2
            exit 1
          fi
          if [ -z "$KUNCI" ]; then
            echo "GAGAL: secret SUPABASE_PUBLISHABLE_KEY kosong atau tidak ditemukan." >&2
            exit 1
          fi
          # /auth/v1/settings menerima kunci publik dan menjawab 200 bila kuncinya benar.
          KODE="$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "apikey: $KUNCI" "https://$REF.supabase.co/auth/v1/settings")"
          echo "Jawaban jalur API: HTTP $KODE"
          if [ "$KODE" != "200" ]; then
            echo "GAGAL: jalur API Supabase tidak menerima kunci publik (HTTP $KODE). 401 = kunci salah; 000 = tidak tersambung; 5xx = proyek bermasalah atau dijeda." >&2
            exit 1
          fi
          echo "Kunci publik diterima; proyek hidup."

      - name: Uji akses tanpa login (database dan internet)
        if: ${{ !cancelled() }}
        env:
          KUNCI: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: db/uji_akses_supabase.sh
