name: Pasang ke Supabase

# Memasang perubahan ke database utama. Dua cara memicu:
#   1. Tombol: pemilik mengetik PASANG.
#   2. Dorongan ke cabang "pasang": dilakukan Claude hanya setelah pemilik mengetik "buat" untuk paket
#      yang menyebut pemasangan (aturan 8 di CLAUDE.md). Hanya sah kalau commit-nya sama dengan commit
#      terbaru main dan uji otomatis untuk commit itu sudah lulus. (Tag tidak dipakai: jalur akses
#      Claude menolak pengiriman tag, HTTP 403, 13 Nov 2026.)
# Urutan: cadangan dulu (disimpan 30 hari) -> migrasi -> data awal bila kosong -> pemeriksaan.
on:
  push:
    branches: [pasang]
  workflow_dispatch:
    inputs:
      konfirmasi:
        description: "Ketik PASANG untuk melanjutkan"
        required: true

concurrency:
  group: pasang-supabase
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  pasang:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Periksa izin memasang dan secret
        env:
          KONFIRMASI: ${{ inputs.konfirmasi }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$KONFIRMASI" != "PASANG" ]; then
              echo "GAGAL: konfirmasi bukan PASANG. Tidak ada yang diubah." >&2
              exit 1
            fi
          else
            MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$GITHUB_SHA" != "$MAIN" ]; then
              echo "GAGAL: cabang pasang menunjuk $GITHUB_SHA, bukan commit terbaru main ($MAIN). Tidak ada yang diubah." >&2
              exit 1
            fi
            # Dorongan ke cabang pasang juga memicu uji otomatis baru; cukup satu yang lulus dan tidak boleh ada yang gagal.
            HASIL="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "uji") | .conclusion] | if any(. == "failure" or . == "cancelled") then "gagal" elif any(. == "success") then "success" else "belum" end')"
            if [ "$HASIL" != "success" ]; then
              echo "GAGAL: uji otomatis untuk commit ini belum lulus (hasil: $HASIL). Tidak ada yang diubah." >&2
              exit 1
            fi
            echo "Dorongan ke cabang pasang sah: commit terbaru main, uji otomatis lulus."
          fi
          if [ -z "$DB_URL" ]; then
            echo "GAGAL: secret SUPABASE_DB_URL kosong atau tidak ditemukan." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Pasang klien Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Cadangan dulu
        run: |
          mkdir -p cadangan
          db/pasang_supabase.sh cadangan "cadangan/sebelum-pasang-$(date -u +%Y%m%d-%H%M%S).dump"

      - name: Simpan cadangan (30 hari)
        uses: actions/upload-artifact@v4
        with:
          name: cadangan-sebelum-pasang-${{ github.run_number }}
          path: cadangan/
          retention-days: 30
          if-no-files-found: error

      - name: Migrasi, data awal, pemeriksaan
        run: db/pasang_supabase.sh pasang
